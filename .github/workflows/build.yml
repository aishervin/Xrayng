name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download core dependencies
      run: |
        mkdir -p app/libs
        curl -L -o app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.8.20/libv2ray.aar"

    - name: Restore Keystore
      run: |
        mkdir -p keystore
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > keystore/debug.keystore
        else
          keytool -genkey -v -keystore keystore/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
        fi

    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease
    
    - name: Rename APK
      run: |
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Xrayng-release.apk; fi
    
    - name: Upload universal APK
      uses: actions/upload-artifact@v4
      if: ${{ success() }}
      with:
        name: universal-apk
        path: app/build/outputs/apk/release/*.apk

  sign-and-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Upload APKs to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release/**/*.apk
          tag: ${{ inputs.release_tag }}
          file_glob: true
          prerelease: false

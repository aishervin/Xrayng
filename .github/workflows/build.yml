name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download core dependencies
      run: |
        mkdir -p app/libs
        curl -fL -o app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.8.20/libv2ray.aar"

    - name: Restore Keystore
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p keystore

        decode_keystore() {
          local input="$1"
          local output="$2"
          printf '%s' "$input" | tr -d '[:space:]' | base64 --decode > "$output"
          test -s "$output"
          keytool -list -keystore "$output" -storepass android >/dev/null 2>&1
        }

        generate_debug_keystore() {
          echo "Generating a new debug keystore..."
          keytool -genkeypair -v -storetype JKS -keystore keystore/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
        }

        if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
          echo "Trying ANDROID_KEYSTORE_BASE64 secret..."
          if decode_keystore "$ANDROID_KEYSTORE_BASE64" keystore/debug.keystore; then
            echo "Using GitHub Actions keystore secret."
          else
            echo "ANDROID_KEYSTORE_BASE64 is empty/invalid; falling back to repository keystore." >&2
            rm -f keystore/debug.keystore
          fi
        fi

        if [ ! -s keystore/debug.keystore ]; then
          if [ ! -s debug.keystore.base64 ]; then
            echo "Stable signing key is missing or empty." >&2
            echo "No repository keystore found — generating a temporary debug keystore so the build can continue." >&2
            generate_debug_keystore
          else
            echo "Using repository fallback keystore. Attempting to decode..."
            if tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > keystore/debug.keystore 2>/tmp/base64.err; then
              # decoded successfully; validate
              if keytool -list -keystore keystore/debug.keystore -storepass android >/dev/null 2>&1; then
                echo "Repository keystore restored and validated."
              else
                echo "Repository keystore decoded but is invalid/corrupted." >&2
                echo "Generating a temporary debug keystore to allow CI to continue." >&2
                rm -f keystore/debug.keystore
                generate_debug_keystore
              fi
            else
              echo "Repository keystore base64 decode failed:" >&2
              sed -n '1,200p' /tmp/base64.err >&2 || true
              echo "Generating a temporary debug keystore to allow CI to continue." >&2
              rm -f keystore/debug.keystore || true
              generate_debug_keystore
            fi
          fi
        fi

        echo "Keystore restored or generated and validated successfully."

    - name: Build APK
      run: |
        chmod +x gradlew
        if [ -n "${{ inputs.release_tag }}" ]; then
          CLEAN_TAG=$(echo "${{ inputs.release_tag }}" | sed "s/^v//")
          ./gradlew assembleRelease -PVERSION_NAME=$CLEAN_TAG
        else
          ./gradlew assembleRelease
        fi

    - name: Upload universal APK
      uses: actions/upload-artifact@v4
      if: ${{ success() }}
      with:
        name: release-apks
        path: app/build/outputs/apk/release/*.apk

  sign-and-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Upload APKs to release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*.apk
          tag_name: ${{ inputs.release_tag }}
          prerelease: false

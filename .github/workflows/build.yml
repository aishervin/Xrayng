name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download core dependencies
      run: |
        mkdir -p app/libs
        curl -L -o app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.8.20/libv2ray.aar"

    - name: Restore Keystore
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        mkdir -p keystore
        if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/debug.keystore
        elif [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > keystore/debug.keystore
        else
          echo "Stable signing key is missing" >&2
          exit 1
        fi

    - name: Build APK
      run: |
        chmod +x gradlew
        if [ -n "${{ inputs.release_tag }}" ]; then
          CLEAN_TAG=$(echo "${{ inputs.release_tag }}" | sed "s/^v//")
          ./gradlew assembleRelease -PVERSION_NAME=$CLEAN_TAG
        else
          ./gradlew assembleRelease
        fi

    - name: Upload universal APK
      uses: actions/upload-artifact@v4
      if: ${{ success() }}
      with:
        name: release-apks
        path: app/build/outputs/apk/release/*.apk

  sign-and-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Upload APKs to release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*.apk
          tag_name: ${{ inputs.release_tag }}
          prerelease: false

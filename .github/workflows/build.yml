name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download core dependencies
      run: |
        mkdir -p app/libs
        curl -fL -o app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.8.20/libv2ray.aar"

    - name: Restore Keystore
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p keystore

        if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
          echo "ANDROID_KEYSTORE_BASE64 is required for a stable release signature." >&2
          exit 1
        fi

        printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > keystore/debug.keystore
        test -s keystore/debug.keystore
        keytool -list -keystore keystore/debug.keystore -storepass android -alias androiddebugkey >/dev/null
        echo "Release keystore restored and validated."

    - name: Run unit tests
      run: |
        chmod +x gradlew
        ./gradlew testReleaseUnitTest

    - name: Build APK
      run: |
        TAG_NAME="${{ inputs.release_tag }}"
        if [ -z "$TAG_NAME" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
          TAG_NAME="${{ github.ref_name }}"
        fi
        if [ -n "$TAG_NAME" ]; then
          CLEAN_TAG=$(echo "$TAG_NAME" | sed "s/^v//")
          ./gradlew assembleRelease -PVERSION_NAME=$CLEAN_TAG
        else
          ./gradlew assembleRelease
        fi

    - name: Upload universal APK
      uses: actions/upload-artifact@v4
      if: ${{ success() }}
      with:
        name: release-apks
        path: app/build/outputs/apk/release/*.apk

  sign-and-release:
    needs: build
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Upload APKs to release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*.apk
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          prerelease: false
